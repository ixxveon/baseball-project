reviews:
  language: "ko-KR"
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"
      - "main"

  instructions: |
    이 프로젝트(위닝픽/WinningPick)는 Spring Boot(백엔드) + React(프론트엔드) + FastAPI 모노레포입니다.
    아래 팀 컨벤션(docs/CONVENTION.md 요약)을 기준으로 코드를 리뷰하고, 모든 리뷰 코멘트는 반드시 한국어로 작성해 주세요.

    ## 네이밍 규칙
    - 클래스: Controller / Service / Repository 접미사 사용. Entity는 단수 명사(접미사 없음, Setter 금지).
    - DTO 파일명: `Request{기능명}` / `Response{기능명}` 형식으로 dto/request, dto/response에 각각 독립 파일로 분리 (이너 클래스 금지). Java record 우선 사용.
    - 예외 클래스: 새 Exception 파일 신규 생성 금지, 도메인별 ErrorCode enum 재사용.
    - 메서드 / 변수: camelCase. 상수: UPPER_SNAKE_CASE.
    - API URL: 소문자 kebab-case, 명사형 복수 (예: /api/v1/job-notices).
    - Enum 패키지: `type/` 사용. 클래스명은 ~Type(권한/구분) 또는 ~Status(진행상태) 접미사.

    ## 예외 처리 규칙
    - 새로운 Exception 클래스 파일 생성 금지.
    - `throw new RuntimeException("문자열")` 형태의 하드코딩 예외 금지.
    - 반드시 도메인별 `{Domain}ErrorCode` enum 상수를 주입하여 예외 발생.
    - 전역 공통 에러는 `GlobalErrorCode`, 도메인 에러는 `domain/{domain}/exception/{Domain}ErrorCode`에서 관리.

    ## 응답 표준화
    - 모든 API 응답은 `ApiResponse<T>` (`success`/`message`/`data` 필드) 래퍼 사용.
    - 실패 응답도 `data` 필드 유지 (필드 생략 금지), `@Valid` 검증 실패 시 필드별 에러를 Map으로 반환.
    - Controller는 HTTP 요청/응답 전달 역할만 수행, 비즈니스 로직이나 Entity 직접 반환 금지.

    ## JPA 규칙
    - Entity에 `@Setter` 사용 금지, 의미 있는 비즈니스 메서드로만 상태 변경.
    - `@NoArgsConstructor(access = AccessLevel.PROTECTED)` 필수.
    - PK 전략: `GenerationType.IDENTITY` + `Long`.
    - 연관관계는 단방향 우선, Fetch 전략은 `FetchType.LAZY`만 허용 (EAGER 금지).
    - Enum 컬럼에는 `@Enumerated(EnumType.STRING)` 필수.

    ## Swagger 문서화 규칙
    - `@Tag`, `@Operation` 등 Swagger 어노테이션은 `docs/` 패키지의 `{Domain}ControllerDocs` 인터페이스에만 작성.
    - 실제 Controller 클래스에 Swagger 어노테이션 직접 작성 금지 (`implements`로 구현).

    ## 프론트엔드 규칙
    - `any` 타입 사용 금지 (`unknown` 사용). `!`(non-null assertion) 대신 옵셔널 체이닝/타입 가드 사용.
    - 백엔드 상태값을 JSX에 문자열로 직접 박아넣지 않고 `as const` 상수 객체 사용.
    - API 응답은 공용 axios 인스턴스를 통해 호출하고 `response.data.data`로 꺼내 쓰는지 확인.
    - 인터페이스/타입명에 `I` prefix 사용 금지.

    ## FastAPI 규칙
    - 환경 변수 접근은 `core/` 설정 계층을 통해서만 수행.
    - API 라우터(`service/api/`)에 복잡한 비즈니스 로직을 직접 작성하지 않았는지 확인.

    ## 커밋 메시지 규칙
    - 형식: `{type}: {summary}` (Conventional Commits) — feat / fix / docs / style / refactor / test / chore

    ## 브랜치 네이밍 규칙
    - `feature/[도메인명]-[세부기능]` (도메인별 풀스택 오너십이라 영역 구분 없음)
    - 예: `feature/member-login`, `feature/community-post-write`, `feature/win-prediction-model`

  path_instructions:
    - path: "backend/**/*.java"
      instructions: |
        백엔드 Java 코드 리뷰 시 아래 항목을 중점적으로 확인해 주세요.
        - DTO가 `dto/request`, `dto/response`에 독립 파일로 분리되어 있는지 (이너 클래스 금지)
        - `{Domain}ErrorCode` 기반 예외 처리 여부 (RuntimeException 하드코딩, 신규 Exception 파일 생성 금지)
        - `ApiResponse<T>` 래퍼 적용 여부, Controller에서 Entity 직접 반환 여부
        - Entity에 `@Setter` 사용 여부, `@NoArgsConstructor(access = AccessLevel.PROTECTED)` 누락 여부
        - Enum 컬럼에 `@Enumerated(EnumType.STRING)` 누락 여부
        - 연관관계 Fetch 전략이 `FetchType.LAZY`인지 (EAGER 금지)
        - Swagger 어노테이션이 Controller 본문에 직접 작성되었는지 (docs/ 인터페이스로 분리해야 함)
        - N+1 쿼리 가능성, 페이지네이션 없는 전체 목록 조회 API 여부

    - path: "frontend/**/*.{ts,tsx}"
      instructions: |
        프론트엔드 코드 리뷰 시 아래 항목을 중점적으로 확인해 주세요.
        - `any` 타입, `!`(non-null assertion) 사용 여부
        - 백엔드 상태값 문자열 하드코딩 여부 (`as const` 상수 객체 사용 권장)
        - API 응답 파싱이 `ApiResponse<T>` 구조와 일치하는지, 공용 axios 인스턴스를 사용하는지
        - 인터페이스/타입명에 `I` prefix 사용 여부

    - path: "fastapi/**/*.py"
      instructions: |
        FastAPI 코드 리뷰 시 환경 변수를 `core/`를 통해 접근하는지, 라우터에 비즈니스 로직이 직접 작성되지 않았는지 확인해 주세요.

chat:
  auto_reply: true
