spring.application.name=winning-pick
server.port=8080

springdoc.swagger-ui.path=/swagger-ui/index.html

# application-secret.yml이 없어도(신규 clone 직후) 기동되도록 optional import + H2 기본값 사용
# 실제 PostgreSQL로 붙이고 싶으면 로컬에 application-secret.yml을 만들어 datasource를 덮어쓴다
spring.config.import=optional:application-secret.yml

spring.datasource.url=jdbc:h2:mem:winningpick;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# data.sql이 테이블 생성보다 먼저 실행되는 기본 순서를 뒤집어서, Hibernate가 테이블을 만든 다음 시드가 들어가게 함
spring.jpa.defer-datasource-initialization=true

# data.sql에 팀 공용 시드 데이터가 있어서 항상 실행 (id 고정 + ON CONFLICT DO NOTHING이라 재부팅해도 중복 삽입 안 됨)
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# docker-compose.yml의 redis 서비스에 맞춘 로컬 기본값
spring.data.redis.host=localhost
spring.data.redis.port=6379
