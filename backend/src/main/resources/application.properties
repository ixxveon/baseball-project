spring.application.name=winning-pick
server.port=8080

springdoc.swagger-ui.path=/swagger-ui/index.html

# application-secret.yml이 없어도(신규 clone 직후) 기동되도록 optional import + H2 기본값 사용
# 실제 PostgreSQL로 붙이고 싶으면 로컬에 application-secret.yml을 만들어 datasource를 덮어쓴다
spring.config.import=optional:application-secret.yml

spring.datasource.url=jdbc:h2:mem:winningpick;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql이 비어있는 동안 초기화 스크립트 실행 스킵 (실 시드 데이터 작성 시 always로 변경)
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
