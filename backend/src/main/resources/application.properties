spring.application.name=winning-pick
server.port=8080

springdoc.swagger-ui.path=/swagger-ui/index.html

# application-secret.yml이 없어도(신규 clone 직후) 기동되도록 optional import + H2 기본값 사용
# 실제 PostgreSQL로 붙이고 싶으면 로컬에 application-secret.yml을 만들어 datasource를 덮어쓴다
spring.config.import=optional:application-secret.yml

spring.datasource.url=jdbc:h2:mem:winningpick;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql이 비어있는 동안 초기화 스크립트 실행 스킵 (실 시드 데이터 작성 시 always로 변경)
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# docker-compose.yml의 redis 서비스에 맞춘 로컬 기본값
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 카카오는 스프링에 내장된 제공자가 아니라서 직접 알려줘야 함
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# 카카오 키가 없는 환경에서도 서버가 기동되도록 자리표시 기본값을 둔다. 실제 키는 application-secret.yml에서 덮어쓴다.
spring.security.oauth2.client.registration.kakao.client-id=not-configured
spring.security.oauth2.client.registration.kakao.client-secret=not-configured

# 네이버도 스프링에 내장된 제공자가 아니라서 직접 알려줘야 함
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# 네이버 키가 없는 환경에서도 서버가 기동되도록 자리표시 기본값을 둔다. 실제 키는 application-secret.yml에서 덮어쓴다.
spring.security.oauth2.client.registration.naver.client-id=not-configured
spring.security.oauth2.client.registration.naver.client-secret=not-configured

jwt.access-token-validity-in-seconds=3600
